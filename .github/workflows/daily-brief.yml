name: Daily Higher Ed Brief

on:
  schedule:
    - cron: '0 10 * * 1-5'
  workflow_dispatch:

jobs:
  generate-brief:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate content (JSON)
        run: |
          echo "Calling Claude API to generate daily content..."
          RESPONSE=$(curl -s -w "\n%{http_code}" https://api.anthropic.com/v1/messages \
            -H 'Content-Type: application/json' \
            -H 'x-api-key: ${{ secrets.ANTHROPIC_API_KEY }}' \
            -H 'anthropic-version: 2023-06-01' \
            -d @generate-prompt.json)
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "HTTP Status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "API call failed with status $HTTP_CODE"
            echo "Error: $(echo $BODY | head -c 500)"
            exit 1
          fi
          echo "$BODY" | python3 << 'PYEOF'
          import sys, json, re

          data = json.load(sys.stdin)
          text = ''.join(b.get('text','') for b in data.get('content',[]))

          # Strategy: find the outermost { } pair that contains valid JSON
          # First strip code fences
          text = re.sub(r'```json\s*', '', text)
          text = re.sub(r'```\s*', '', text)

          # Find the first { and last }
          first_brace = text.find('{')
          last_brace = text.rfind('}')

          if first_brace == -1 or last_brace == -1:
            print("ERROR: No JSON object found in response")
            print(f"Response preview: {text[:500]}")
            sys.exit(1)

          json_str = text[first_brace:last_brace + 1]

          try:
            parsed = json.loads(json_str)
            with open('daily_data.json', 'w') as f:
              json.dump(parsed, f)
            stories = len(parsed.get('todayStories', [])) + len(parsed.get('archiveStories', []))
            charts = len(parsed.get('charts', []))
            print(f'Success: {stories} stories, {charts} charts generated')
          except json.JSONDecodeError as e:
            print(f'ERROR: JSON parse failed: {e}')
            print(f'JSON preview: {json_str[:500]}')
            sys.exit(1)
          PYEOF

      - name: Wait for rate limit reset
        run: |
          echo "Waiting 3 minutes..."
          sleep 180

      - name: Verify content
        run: |
          python3 << 'PYEOF'
          import json
          with open('daily_data.json') as f: data = json.load(f)
          items = []
          for s in data.get('todayStories', []) + data.get('archiveStories', []):
            items.append({"id": s.get("id"), "url": s.get("sourceUrl",""), "headline": s.get("headline",""), "source": s.get("source","")})
          for i, c in enumerate(data.get('charts', [])):
            items.append({"id": f"chart_{i}", "url": c.get("sourceUrl",""), "headline": c.get("title",""), "source": c.get("sourceText","")})
          req = {
            "model": "claude-sonnet-4-6",
            "max_tokens": 4000,
            "tools": [{"type": "web_search_20250305", "name": "web_search"}],
            "system": "You verify news dashboard links. For each item, use web search to visit the URL and confirm: (1) the link works, (2) the article matches the headline, (3) the source is not an admissions consultancy firm. Return ONLY a JSON object, no markdown, no code fences, no preamble text.",
            "messages": [{"role": "user", "content": "Verify these URLs. Return JSON: {\"remove\": [list of id values to remove], \"fix_urls\": {\"old_url\": \"new_url\"}}. If all pass: {\"remove\":[], \"fix_urls\":{}}.\n\n" + json.dumps(items, indent=2)}]
          }
          with open('verify_request.json', 'w') as f: json.dump(req, f)
          print(f"Verification request built: {len(items)} items to check")
          PYEOF
          echo "Calling Claude API to verify links..."
          RESPONSE=$(curl -s -w "\n%{http_code}" https://api.anthropic.com/v1/messages \
            -H 'Content-Type: application/json' \
            -H 'x-api-key: ${{ secrets.ANTHROPIC_API_KEY }}' \
            -H 'anthropic-version: 2023-06-01' \
            -d @verify_request.json)
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "Verify HTTP Status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Verification failed with status $HTTP_CODE. Publishing unverified."
            echo '{"remove":[],"fix_urls":{}}' > corrections.json
          else
            echo "$BODY" | python3 << 'PYEOF'
          import sys, json, re
          data = json.load(sys.stdin)
          text = ''.join(b.get('text','') for b in data.get('content',[]))
          text = re.sub(r'```json\s*', '', text)
          text = re.sub(r'```\s*', '', text)
          first = text.find('{')
          last = text.rfind('}')
          if first != -1 and last != -1:
            try:
              c = json.loads(text[first:last+1])
              with open('corrections.json','w') as f: json.dump(c, f)
              print(f'Corrections: {c}')
            except:
              print(f'Parse failed, skipping corrections')
              with open('corrections.json','w') as f: f.write('{"remove":[],"fix_urls":{}}')
          else:
            with open('corrections.json','w') as f: f.write('{"remove":[],"fix_urls":{}}')
          PYEOF
          fi

      - name: Apply corrections and build dashboard
        run: |
          python3 << 'PYEOF'
          import json

          with open('daily_data.json') as f: data = json.load(f)
          with open('corrections.json') as f: corr = json.load(f)

          # Apply URL fixes
          fixes = corr.get('fix_urls', {})
          if fixes:
            data_str = json.dumps(data)
            for old, new in fixes.items():
              if old and new:
                data_str = data_str.replace(old, new)
                print(f'Fixed URL: {old} -> {new}')
            data = json.loads(data_str)

          # Remove flagged items
          remove_ids = corr.get('remove', [])
          if remove_ids:
            data['todayStories'] = [s for s in data.get('todayStories',[]) if s.get('id') not in remove_ids]
            data['archiveStories'] = [s for s in data.get('archiveStories',[]) if s.get('id') not in remove_ids]
            chart_removes = [r for r in remove_ids if isinstance(r, str) and r.startswith('chart_')]
            if chart_removes:
              chart_indices = [int(r.split('_')[1]) for r in chart_removes]
              data['charts'] = [c for i, c in enumerate(data.get('charts',[])) if i not in chart_indices]
            print(f'Removed {len(remove_ids)} items')

          # Inject data into template
          with open('template.html') as f: template = f.read()
          data_json = json.dumps(data)
          html = template.replace('/*INJECT_DATA*/null', data_json)
          with open('index.html', 'w') as f: f.write(html)

          stories = len(data.get('todayStories',[])) + len(data.get('archiveStories',[]))
          charts = len(data.get('charts',[]))
          print(f'Dashboard built: {stories} stories, {charts} charts, {len(html)} chars')
          PYEOF

      - name: Publish
        run: |
          git config user.name 'github-actions'
          git config user.email 'actions@github.com'
          git add index.html
          git diff --cached --quiet || (git commit -m 'Daily brief update' && git push)
